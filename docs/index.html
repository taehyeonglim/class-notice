<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121b28">
  <meta name="description" content="공지, 준비물, 숙제와 학급 일정을 확인하는 온라인 학급 알림장">
  <title>우리반 알림장</title>
  <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="frame topbar-inner">
      <div class="brand">
        <h1><a href="./">우리반 알림장</a></h1>
        <span id="class-name">3학년 2반</span>
      </div>
      <div class="teacher-actions">
        <button class="button outline" id="teacher" type="button" disabled><i class="icon icon-lock" aria-hidden="true"></i> 교사 로그인</button>
        <button class="button primary" id="compose" type="button" hidden>＋ 새 알림 쓰기</button>
      </div>
    </div>
  </header>
  <main class="frame">
    <section class="board" aria-labelledby="board-title">
      <div class="board-heading">
        <div><h2 id="board-title">학급 알림</h2><p id="count" role="status">알림을 불러오는 중입니다.</p></div>
        <label class="search"><i class="icon icon-search" aria-hidden="true"></i><input id="search" type="search" placeholder="알림 검색" aria-label="알림 검색"></label>
      </div>
      <div id="filters" class="filters" role="group" aria-label="알림 분류">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="notice" aria-pressed="false">공지</button>
        <button type="button" data-filter="supplies" aria-pressed="false">준비물</button>
        <button type="button" data-filter="homework" aria-pressed="false">숙제</button>
        <button type="button" data-filter="schedule" aria-pressed="false">일정</button>
      </div>
      <div id="notices" aria-busy="true"></div>
      <noscript><p class="empty">알림장을 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
    </section>
  </main>
  <footer class="frame footer"><span id="footer-class">3학년 2반 알림장</span><span id="demo-label" hidden>체험 모드 · 변경 사항은 이 브라우저에 저장됩니다.</span></footer>

  <dialog id="login-dialog" aria-labelledby="login-title">
    <div class="dialog-head"><h2 id="login-title">교사 로그인</h2><button class="close" type="button" data-close aria-label="닫기">×</button></div>
    <form id="login-form">
      <p id="login-hint" hidden>체험 모드에서는 계정 없이 알림을 작성해 볼 수 있습니다.</p>
      <div id="credentials" class="fields">
        <label>이메일<input type="email" name="email" autocomplete="username" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
      </div>
      <p class="error" id="login-error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="button primary" id="login-submit" type="submit">로그인</button></div>
    </form>
  </dialog>

  <dialog id="editor-dialog" aria-labelledby="editor-title">
    <div class="dialog-head"><h2 id="editor-title">새 알림 쓰기</h2><button class="close" type="button" data-close aria-label="닫기">×</button></div>
    <form id="editor-form">
      <div class="fields">
        <label>분류<select name="category"><option value="notice">공지</option><option value="supplies">준비물</option><option value="homework">숙제</option><option value="schedule">일정</option></select></label>
        <label>제목<input name="title" maxlength="100" required placeholder="알림 제목"></label>
        <label>내용<textarea name="body" rows="6" maxlength="5000" required placeholder="학생과 학부모에게 전할 소식을 적어 주세요."></textarea></label>
        <label class="checkbox"><input name="pinned" type="checkbox"> 같은 날짜에서 상단에 고정</label>
      </div>
      <p class="error" id="editor-error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="button outline" type="button" data-close>취소</button><button class="button primary" id="editor-submit" type="submit">게시하기</button></div>
    </form>
  </dialog>

  <dialog id="notice-dialog" aria-labelledby="notice-title">
    <div class="dialog-head"><div id="notice-meta"></div><button class="close" type="button" data-close aria-label="닫기">×</button></div>
    <h2 id="notice-title"></h2>
    <p id="notice-body"></p>
    <div class="dialog-actions" id="notice-actions" hidden>
      <button class="button danger" id="delete" type="button">삭제</button>
      <button class="button outline" id="edit" type="button">수정</button>
    </div>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <div class="dialog-head"><h2 id="delete-title">알림을 삭제할까요?</h2><button class="close" type="button" data-close aria-label="닫기">×</button></div>
    <p>삭제한 알림은 복구할 수 없습니다.</p>
    <p class="error" id="delete-error" role="alert" hidden></p>
    <div class="dialog-actions"><button class="button outline" type="button" data-close>취소</button><button class="button danger" id="confirm-delete" type="button">삭제하기</button></div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
